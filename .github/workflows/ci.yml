name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # unstable_cache keys on its key parts and never on the code that
      # produced the value, so adding a field to a cached return type does not
      # invalidate what is already on disk — the new code reads old objects
      # silently missing it. Phase 4 shipped that (`variantId` on
      # SizeAvailability) and add-to-bag quietly believed no size had been
      # chosen. This fails the build when a cached shape changes and
      # SHAPE_VERSION does not. See scripts/shape-snapshot.ts.
      - name: Cached shapes match SHAPE_VERSION
        run: npm run shapes

      # Placeholder values only. The build must not require live Supabase
      # credentials — if it does, something is reaching the database at build
      # time that should be reaching it at request time.
      #
      # STATIC_PARAMS_ALLOW_EMPTY is this build declaring that its artifact
      # never serves traffic. Since 2026-08-10, staticParamsOr fails the build
      # when it cannot collect slugs — a slug route built from an empty list is
      # classified SSG with zero pages rendered, never discovers it reads
      # cookies(), and 500s on every request. CI's placeholder credentials make
      # every collection fail by design, so CI alone opts back into the empty
      # fallback. Vercel builds must never set this variable.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://footvault.example
          STATIC_PARAMS_ALLOW_EMPTY: "1"

      # A "use server" module may only export async functions. Exporting a plain
      # object from one type-checks, builds clean, and then throws the first
      # time the action is invoked — which is in production, on a button press.
      # Phase 4 shipped exactly that (a SIGN_IN_IDLE constant) and only found it
      # by clicking. `export type` is erased at build time and is fine.
      #
      # The file list matches a *directive*, not a mention. It used to be
      # `grep -rl '"use server"' src`, which matches the string anywhere —
      # including inside prose. Phase 6 added src/lib/orders/replacement.ts,
      # whose doc comment explains that a "use server" file may only export
      # async functions, and thereby tripped the check that enforces it. CI has
      # been red on main since that merge. A directive is a string-literal
      # statement, so it is anchored to the start and end of its own line, and
      # both quote styles are matched because Prettier's choice is not a rule.
      - name: Assert "use server" files export only async functions
        run: |
          offenders=""
          directives=$(
            { grep -rlE '^[[:space:]]*"use server";?[[:space:]]*$' src || true
              grep -rlE "^[[:space:]]*'use server';?[[:space:]]*\$" src || true
            } | sort -u
          )
          for f in $directives; do
            hits=$(grep -nE '^export (const|let|var|class|enum|function[^ ]*[^c] )' "$f"               | grep -vE '^\s*[0-9]+:export (async function|type|interface)' || true)
            if [ -n "$hits" ]; then
              offenders="$offenders$f\n$hits\n"
            fi
          done
          if [ -n "$offenders" ]; then
            echo 'A "use server" file may only export async functions:'
            printf "$offenders"
            exit 1
          fi

  # The service_role key must never reach the browser bundle. This fails the PR
  # if it is referenced anywhere outside the server-only Supabase admin client.
  secrets:
    name: Guard the service_role key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assert SUPABASE_SERVICE_ROLE_KEY is server-only
        run: |
          matches=$(grep -rn "SUPABASE_SERVICE_ROLE_KEY" src 2>/dev/null \
            | grep -v "^src/lib/supabase/admin.ts:" || true)
          if [ -n "$matches" ]; then
            echo "service_role key referenced outside src/lib/supabase/admin.ts:"
            echo "$matches"
            exit 1
          fi

      # .github is excluded because this very file contains the pattern and
      # would otherwise match itself. Workflow files are never bundled, so
      # nothing real is missed.
      - name: Assert no NEXT_PUBLIC_ service key
        run: |
          hits=$(grep -rn "NEXT_PUBLIC_SUPABASE_SERVICE" . \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=.github --exclude-dir=.next || true)
          if [ -n "$hits" ]; then
            echo "A service key must never carry the NEXT_PUBLIC_ prefix:"
            echo "$hits"
            exit 1
          fi

      # A Client Component that imports a server-only module is a build error in
      # Next, but only if the import is a *value* import. A type-only import is
      # erased, compiles fine, and quietly invites the next edit to turn it into
      # a real one. This keeps the boundary structural: shared view models live
      # in src/lib/catalog-types.ts, which has no server dependency.
      - name: Assert client components do not reach server-only modules
        run: |
          offenders=""
          for f in $(grep -rln '"use client"' src || true); do
            if grep -qE 'from "@/lib/supabase/(server|admin|static)"|from "@/lib/queries/' "$f"; then
              offenders="$offenders$f\n"
            fi
          done
          if [ -n "$offenders" ]; then
            echo "Client components importing a server-only module:"
            printf "$offenders"
            exit 1
          fi

