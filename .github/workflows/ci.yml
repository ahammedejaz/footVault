name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Placeholder values only. The build must not require live Supabase
      # credentials — if it does, something is reaching the database at build
      # time that should be reaching it at request time.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://footvault.example

  # The service_role key must never reach the browser bundle. This fails the PR
  # if it is referenced anywhere outside the server-only Supabase admin client.
  secrets:
    name: Guard the service_role key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assert SUPABASE_SERVICE_ROLE_KEY is server-only
        run: |
          matches=$(grep -rn "SUPABASE_SERVICE_ROLE_KEY" src 2>/dev/null \
            | grep -v "^src/lib/supabase/admin.ts:" || true)
          if [ -n "$matches" ]; then
            echo "service_role key referenced outside src/lib/supabase/admin.ts:"
            echo "$matches"
            exit 1
          fi

      # .github is excluded because this very file contains the pattern and
      # would otherwise match itself. Workflow files are never bundled, so
      # nothing real is missed.
      - name: Assert no NEXT_PUBLIC_ service key
        run: |
          hits=$(grep -rn "NEXT_PUBLIC_SUPABASE_SERVICE" . \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=.github --exclude-dir=.next || true)
          if [ -n "$hits" ]; then
            echo "A service key must never carry the NEXT_PUBLIC_ prefix:"
            echo "$hits"
            exit 1
          fi

      # A Client Component that imports a server-only module is a build error in
      # Next, but only if the import is a *value* import. A type-only import is
      # erased, compiles fine, and quietly invites the next edit to turn it into
      # a real one. This keeps the boundary structural: shared view models live
      # in src/lib/catalog-types.ts, which has no server dependency.
      - name: Assert client components do not reach server-only modules
        run: |
          offenders=""
          for f in $(grep -rln '"use client"' src || true); do
            if grep -qE 'from "@/lib/supabase/(server|admin|static)"|from "@/lib/queries/' "$f"; then
              offenders="$offenders$f\n"
            fi
          done
          if [ -n "$offenders" ]; then
            echo "Client components importing a server-only module:"
            printf "$offenders"
            exit 1
          fi

